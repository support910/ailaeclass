<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#0E7372" />

  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.3/plyr.css" />
  <link rel="stylesheet" href="/carbon-all.css" />

  <script nonce="%sveltekit.nonce%" defer src="https://umami.hz.oncws.com/script.js"
    data-website-id="80a9544a-4dda-4c91-b62f-b6be7a8a3b5c"></script>

  <!-- defer: this is an external CDN script that only the lesson video player needs.
       Without it, every page blocks HTML parsing on a round trip to cdn.plyr.io.
       Deferred scripts still run in document order before DOMContentLoaded, so it is
       ready by the time ComponentVideo's onMount calls it, and that call is guarded. -->
  <script nonce="%sveltekit.nonce%" defer src="https://cdn.plyr.io/3.7.3/plyr.js"></script>

  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
